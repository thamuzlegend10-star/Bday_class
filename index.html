<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Birthday Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" shape-rendering="crispEdges">
    <symbol id="i-cake" viewBox="0 0 16 16"><path d="M7 1h2v3H7zM3 6h10v3H3zM2 10h12v4H2z"/></symbol>
    <symbol id="i-cal" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M2 3h12v11H2zM3 7h10v6H3z"/><path d="M4 1h2v3H4zM10 1h2v3h-2z"/></symbol>
    <symbol id="i-chat" viewBox="0 0 16 16"><path d="M2 2h12v9H9l-3 3v-3H2z"/></symbol>
  </svg>
  <audio id="mc-click-sound" src="audio/mc.mp3" preload="auto"></audio>

  <div class="shell">
    <aside class="side">
      <div class="brand">
        <svg class="ico" aria-hidden="true"><use href="#i-cake"/></svg>
        <div><b>BIRTHDAY</b><small>Class tracker</small></div>
      </div>
      <nav class="tabs" aria-label="Main">
        <button class="tab is-on" data-page="birthdays" aria-current="page"><svg class="ico" aria-hidden="true"><use href="#i-cake"/></svg><span>Birthdays</span></button>
        <button class="tab" data-page="calendar"><svg class="ico" aria-hidden="true"><use href="#i-cal"/></svg><span>Calendar</span></button>
        <button class="tab" data-page="feedback"><svg class="ico" aria-hidden="true"><use href="#i-chat"/></svg><span>Feedback</span></button>
      </nav>
    </aside>

    <main>
      <!-- Birthdays -->
      <section id="page-birthdays" class="page is-on">
        <header class="panel hero">
          <div class="hero-main">
            <span class="eyebrow">Next up</span>
            <h1 id="hero-name">Loading…</h1>
            <p id="hero-sub" class="sub"></p>
            <div class="xp" role="img" aria-label="Progress toward the next birthday">
              <div class="xp-bar"><div class="xp-fill" id="xp-fill"></div></div>
              <span id="xp-label" class="xp-label"></span>
            </div>
          </div>
          <div class="hero-date">
            <span class="eyebrow">Today</span>
            <strong id="today-label">—</strong>
          </div>
        </header>

        <div class="hotbar" aria-label="Statistics">
          <div class="slot"><span class="eyebrow">Tracked</span><strong id="stat-total">–</strong><small>classmates</small></div>
          <div class="slot"><span class="eyebrow">This month</span><strong id="stat-month">–</strong><small id="stat-month-hint">birthdays</small></div>
          <div class="slot slot--gold"><span class="eyebrow">Next</span><strong id="stat-next-days">–</strong><small id="stat-next-name">—</small></div>
        </div>

        <div class="grid">
          <section class="panel">
            <div class="head"><h2>Coming up</h2><span class="muted">Next 6</span></div>
            <div id="birthday-list" class="list"></div>
          </section>
          <section class="panel">
            <div class="head"><h2>By month</h2><span class="muted">Full year</span></div>
            <div id="bar-graph" class="cols"></div>
          </section>
        </div>
      </section>

      <!-- Calendar -->
      <section id="page-calendar" class="page">
        <div class="panel">
          <div class="head cal-head">
            <button class="btn btn--sq" id="cal-prev" aria-label="Previous month">‹</button>
            <h2 id="calendar-title" aria-live="polite">—</h2>
            <button class="btn btn--sq" id="cal-next" aria-label="Next month">›</button>
          </div>
          <div class="dow" aria-hidden="true"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
          <div id="calendar-days" class="days"></div>
          <div class="legend">
            <span><i class="dot dot--gold"></i>Today</span>
            <span><i class="dot dot--green"></i>Birthday</span>
          </div>
        </div>
        <div class="panel" id="day-detail" aria-live="polite"></div>
      </section>

      <!-- Feedback -->
      <section id="page-feedback" class="page">
        <div class="panel narrow">
          <div class="head"><h2>Feedback</h2><span class="badge">In progress</span></div>
          <p class="sub">Tell me what you think of this site. It goes straight to my email.</p>
          <form id="advice-form" class="form" action="mailto:justinkwok800@gmail.com" method="post" enctype="text/plain">
            <label for="name">Your name</label>
            <input type="text" id="name" name="name" class="field" autocomplete="name" required />
            <label for="message">Your advice</label>
            <textarea id="message" name="message" class="field" rows="5" required></textarea>
            <div class="form-foot">
              <button type="submit" class="btn btn--go">Send feedback</button>
              <span id="form-hint" class="muted" role="status"></span>
            </div>
          </form>
        </div>
      </section>
    </main>
  </div>

  <script src="birthdays.js"></script>
  <script src="script.js"></script>
</body>
</html>
